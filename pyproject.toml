[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vpn-manager"
authors = [{ name = "Luthi" }]
version = "0.1.9"
description = "Gestor de perfiles y conexiones OpenVPN 3 y WireGuard para Linux"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7"]

[project.scripts]
vpn-manager = "vpn_manager.main:main"

[tool.setuptools.packages.find]
where = ["src"]
